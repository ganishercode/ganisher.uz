<style>
:root{--bg:#0A0A0A;--card:#141310;--line:rgba(245,184,61,.18);--gold:#F5B83D;--gold-h:#FFC94D;--ink:#fff;--text:#A1A1A1;--err:#FF7A6B}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{min-height:100dvh;display:grid;place-items:center;padding:20px;background:radial-gradient(600px 400px at 50% 0%,rgba(245,184,61,.10),transparent 70%),var(--bg);color:var(--ink);font:500 16px/1.5 "Plus Jakarta Sans","Segoe UI",system-ui,sans-serif}
.box{width:min(420px,100%);padding:32px 28px;background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:0 30px 60px rgba(0,0,0,.45);display:grid;gap:18px}
.lock{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;background:rgba(245,184,61,.12);border:1px solid var(--line)}
.lock svg{width:28px;height:28px;stroke:var(--gold);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
h1{font-size:24px;line-height:1.2;font-weight:800}
p{color:var(--text);font-size:15px}
label{font-size:14px;font-weight:600;color:var(--ink)}
input{width:100%;height:56px;margin-top:8px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:#0F0E0C;color:var(--ink);font:700 22px/1 "Plus Jakarta Sans",system-ui,sans-serif;letter-spacing:.2em}
input:focus{outline:2px solid var(--gold);outline-offset:2px}
button{height:52px;border:0;border-radius:12px;background:var(--gold);color:#0A0A0A;font:800 16px "Plus Jakarta Sans",system-ui,sans-serif;cursor:pointer;transition:background .2s}
button:hover{background:var(--gold-h)}
button:disabled{opacity:.6;cursor:wait}
.err{min-height:1.4em;color:var(--err);font-size:14px;font-weight:600}
a{color:var(--gold);font-size:14px;text-decoration:none;justify-self:start}
a:hover{text-decoration:underline}
</style>
</head>

async function derive(pw){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:u(D.s),iterations:D.n,hash:'SHA-256'},base,{name:'AES-GCM',length:256},true,['decrypt']);
